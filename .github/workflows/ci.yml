name: CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

# 打 tag 时需要用它创建 Release；fork 的默认 GITHUB_TOKEN 只有只读权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read module.prop
        id: prop
        run: |
          version=$(sed -n 's/^version=//p' module.prop | head -n1)
          description=$(sed -n 's/^description=//p' module.prop | head -n1 | sed 's/^ *//')
          zip_name="${{ github.event.repository.name }}-${version}.zip"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "description=$description" >> "$GITHUB_OUTPUT"
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"

      - name: Pack module
        run: |
          # 模块 zip 只放刷入所需文件，META-INF/customize.sh/module.prop 位于根目录；
          # README 仅随仓库提供，不随包分发
          zip -r "${{ steps.prop.outputs.zip_name }}" . \
            -x ".*" -x "*.zip" -x "README.md" -x "*/.git/*" -x "*/.github/*"

          # 兜底校验：README 一旦混入就让构建失败，避免发出带说明文档的刷机包
          if unzip -l "${{ steps.prop.outputs.zip_name }}" | grep -qiE '(^|/)README\.md$'; then
            echo "::error::模块 zip 中不应包含 README.md"
            exit 1
          fi
          unzip -l "${{ steps.prop.outputs.zip_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ steps.prop.outputs.version }}
          path: ${{ steps.prop.outputs.zip_name }}
          if-no-files-found: error

      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            **模块版本**：${{ steps.prop.outputs.version }}
            **模块说明**：${{ steps.prop.outputs.description }}

            刷入后可用 `adb shell pm list features | grep -E 'cn\.google|services_updater'` 验证，无输出即表示国行 GMS 标签已移除。
          generate_release_notes: true
          files: ${{ steps.prop.outputs.zip_name }}
